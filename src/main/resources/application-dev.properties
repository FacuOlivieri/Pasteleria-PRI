spring.application.name=Pasteleria

# 1. Datasource (H2 in memory) - throwaway data, recreated on every boot
spring.datasource.url=jdbc:h2:mem:pasteleriaDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# 3. H2 console at http://localhost:8080/h2-console (JDBC URL: the one above)
spring.h2.console.enabled=true

# 4. Thymeleaf: no template caching so edits show up on refresh without a restart
spring.thymeleaf.cache=false