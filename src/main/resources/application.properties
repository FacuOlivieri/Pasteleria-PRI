spring.application.name=Pasteleria

# Track the session by cookie only. Without this, Tomcat falls back to rewriting
# every URL as ".../product;jsessionid=ABC..." until the first cookie comes back.
# The session-scoped cart means every visitor now gets a session immediately, so
# that id would end up in referrer headers, access logs and any shared link.
server.servlet.session.tracking-modes=cookie
