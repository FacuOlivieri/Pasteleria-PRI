spring.application.name=Pasteleria

# ---------------------------------------------------------------------------
# "local" profile: a REAL database on your machine, so data survives restarts
# and you can inspect it in phpMyAdmin.
#
# Run it with:  ./mvnw -Dspring.profiles.active=local spring-boot:run
#
# Why a separate "local" profile instead of filling in application-prod.properties:
# root with a blank password is not production. Naming it "prod" would invite
# someone to deploy it exactly as it is.
# ---------------------------------------------------------------------------

# 1. Datasource - XAMPP's database on the default port 3306.
#
# Heads up: XAMPP ships MariaDB 10.4, not Oracle MySQL. We still talk to it with
# the mysql-connector-j driver already in pom.xml (hence the jdbc:mysql:// URL),
# which works for everything this project does. If the driver ever misbehaves
# against MariaDB, the fix is to add the mariadb-java-client dependency.
#
# createDatabaseIfNotExist saves you a manual CREATE DATABASE on first boot.
# useSSL=false because a local XAMPP install has no certificate to verify.
spring.datasource.url=jdbc:mysql://localhost:3306/pasteleria_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# 2. Hibernate / JPA
#
# NOTE: no spring.jpa.database-platform here, on purpose. The dev and test
# profiles pin H2Dialect explicitly; do NOT copy that habit here.
#
# What actually happens, verified by booting it: Hibernate reports
#   Database dialect: MySQLDialect / Database version: 5.5.5
# MariaDB announces itself as "5.5.5-10.4.32-MariaDB" - that "5.5.5-" prefix is a
# legacy flag for old replication clients - and Connector/J reads only the first
# part. So Hibernate believes it is talking to MySQL 5.5, not MariaDB 10.4.
#
# That is cosmetically wrong but functionally fine for this project: the schema it
# generates is InnoDB with every foreign key and utf8mb4, which is all we need.
# The only cost is that Hibernate assumes 5.5-era limits and will not use features
# MariaDB 10.4 does support (CTEs, window functions). Nothing here uses them.
#
# If that ever becomes a real limit, the fix is to pin the dialect explicitly with
#   spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
# and re-verify the generated schema. Do not pin it "just to be tidy".
#
# ddl-auto=update, NOT create-drop: keeping the rows between runs is the entire
# point of this profile. Hibernate adds new tables/columns and never drops data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 3. Thymeleaf: no template caching, so edits show up on refresh without a restart
spring.thymeleaf.cache=false
