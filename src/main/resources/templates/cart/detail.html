<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Your cart', 'cart.css')}"></head>

<body>

<header th:replace="~{fragments/layout :: header}"></header>

<main>

    <section class="page-head" data-hero>
        <div class="page-head__inner">
            <p class="section__eyebrow" data-hero-item>Almost there</p>
            <h1 class="page-head__title" data-hero-item>Your cart</h1>
        </div>
    </section>

    <p class="page-alert page-alert--ok" th:if="${cartMessage}" th:text="${cartMessage}"></p>

    <section class="section" data-reveal>
        <div class="section__inner section__inner--narrow">

            <div class="empty-state" th:if="${#lists.isEmpty(cart.itemsDTO)}">
                <h2>Your cart is empty</h2>
                <p>Nothing in here yet. The catalog is a good place to fix that.</p>
                <a class="btn btn--primary" th:href="@{/pasteleria/product}">Go to the catalog</a>
            </div>

            <div th:unless="${#lists.isEmpty(cart.itemsDTO)}">

                <ul class="cart-list">
                    <li class="cart-line" th:each="item : ${cart.itemsDTO}">

                        <span class="cart-line__thumb" aria-hidden="true"
                              th:text="${#strings.substring(item.productDTO.prodNameDTO, 0, 1)}">P</span>

                        <div class="cart-line__info">
                            <h2 class="cart-line__title">
                                <a th:href="@{/pasteleria/product/{id}(id=${item.productDTO.idProductDTO})}"
                                   th:text="${item.productDTO.prodNameDTO}">Product</a>
                            </h2>
                            <p class="cart-line__unit"
                               th:text="'$ ' + ${#numbers.formatDecimal(item.productDTO.prodPriceDTO, 1, 'POINT', 2, 'COMMA')} + ' each'">
                                $ 0,00 each
                            </p>
                        </div>

                        <span class="cart-line__qty">
                            &times;&nbsp;<span th:text="${item.quantityDTO}">1</span>
                        </span>

                        <span class="cart-line__subtotal"
                              th:text="'$ ' + ${#numbers.formatDecimal(item.subtotalDTO, 1, 'POINT', 2, 'COMMA')}">
                            $ 0,00
                        </span>

                        <form method="post"
                              th:action="@{/pasteleria/cart/{id}/remove(id=${item.productDTO.idProductDTO})}">
                            <button class="btn btn--quiet" type="submit"
                                    th:aria-label="'Remove ' + ${item.productDTO.prodNameDTO}">Remove</button>
                        </form>

                    </li>
                </ul>

                <div class="cart-total">
                    <span class="cart-total__label">Total</span>
                    <span class="cart-total__value"
                          th:text="'$ ' + ${#numbers.formatDecimal(cart.totalDTO, 1, 'POINT', 2, 'COMMA')}">
                        $ 0,00
                    </span>
                </div>

                <div class="cart-actions">
                    <a class="btn btn--outline" th:href="@{/pasteleria/product}">Keep shopping</a>
                    <form method="post" th:action="@{/pasteleria/cart/clear}">
                        <button class="btn btn--ghost" type="submit">Empty cart</button>
                    </form>
                </div>

                <p class="cart-note">
                    Checkout is not wired up yet &mdash; ordering still goes through the contact form.
                </p>

            </div>

        </div>
    </section>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
