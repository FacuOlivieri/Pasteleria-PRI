<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Sign in', 'client.css')}"></head>

<body>

<header th:replace="~{fragments/layout :: header}"></header>

<main>

    <section class="page-head" data-hero>
        <div class="page-head__inner">
            <p class="section__eyebrow" data-hero-item>Welcome back</p>
            <h1 class="page-head__title" data-hero-item>Sign in</h1>
            <p class="page-head__lede" data-hero-item>
                Pick up where you left off.
            </p>
        </div>
    </section>

    <section class="section" data-reveal>
        <div class="section__inner section__inner--narrow">

            <!--
              Bound to LoginFormDTO, not ClientDTO: this form has two fields, so it
              gets an object with two fields. Validator.java is still a stub, so the
              only client-side checks here are the HTML5 ones.
            -->
            <form class="account-form" method="post"
                  th:action="@{/pasteleria/login}"
                  th:object="${loginFormDTO}">

                <p class="form-alert form-alert--ok" th:if="${loginNotice}" th:text="${loginNotice}"></p>
                <p class="form-alert form-alert--error" th:if="${loginError}" th:text="${loginError}"></p>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{emailDTO}" required maxlength="120" autofocus>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{passwordDTO}" required maxlength="72">
                </div>

                <button class="btn btn--primary" type="submit">Sign in</button>

                <p class="field__hint">
                    No account yet?
                    <a th:href="@{/pasteleria/client/new}">Create one</a>.
                </p>
            </form>

        </div>
    </section>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
