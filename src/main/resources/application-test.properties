spring.application.name=Pasteleria
# 1. Configuración del Datasource (H2 en memoria)
spring.datasource.url=jdbc:h2:mem:pasteleriaDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. Dialecto de Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Recrea el esquema de tablas en cada ejecución de pruebas
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# 3. Opcional: Consola H2 (útil si depuras tests pausándolos)
# spring.h2.console.enabled=true
